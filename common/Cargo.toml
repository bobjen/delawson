[package]
name = "delawson-common"
description = "Configuration, wire protocol, and process lifecycle shared by every DeLawson process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "common"
path = "src/lib.rs"

# Configurations built in code, for other crates' tests. A test may not read a
# configuration from disk, and a binary has no use for this.
[features]
testing = []

[dependencies]
aes-gcm = "0.10.3"
aegis = "0.9.15"
crc64-nvme = { git = "https://github.com/bobjen/crc64nvme", version = "0.1.0" }
hkdf = "0.12.4"
libc = "0.2.189"
lz4_flex = "0.14.0"
zstd = "0.13.3"
rand_core = { version = "0.6", default-features = false }
serde.workspace = true
sha2 = "0.10.8"
toml.workspace = true

rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
tempfile = "3"
