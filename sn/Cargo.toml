[package]
name = "delawson-sn"
description = "Stream Node: the extents of a stream and the instances of an extent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "sn"
path = "src/main.rs"

[dependencies]
delawson-common.workspace = true
delawson-raft.workspace = true
parking_lot.workspace = true
delawson-pool.workspace = true
delawson-random.workspace = true
spookyhash.workspace = true

[dev-dependencies]
delawson-common = { workspace = true, features = ["testing"] }
delawson-raft = { workspace = true, features = ["testing"] }
permute = { package = "delawson-permute", path = "../permute" }
tempfile = "3"
