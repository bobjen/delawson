# SN, the Stream Node. One file like this per machine type.


# Share of a machine's metadata budget given to streams rather than extents.
# A guess encoding an assumed workload mix, and the thing to rebalance when a
# machine's mix drifts.
stream_share = 0.333

# Maximum extents this SN can name.
# The limit should be at least the machine RAM size divided by the SN Extent size.
max_extents = 1073741824

# Reject a checkpoint whose saved EN-disk extent indexes disagree with its
# extent rows. Set true to rebuild those derived indexes from extent rows.
repair_checkpoint_indexes = false

# Ask ENs for their disk inventory and extent placement at these intervals.
sync_loop_interval_sec = 1
en_disk_sync_interval_sec = 30
en_extent_sync_interval_sec = 120
# Cap each disk's adjusted free space at this multiple of the average free fraction.
capped_free_space = 1.0
# Subtract this fraction of the average free-space share from each disk after the cap.
subtract_fraction_average_free = 0.1

# Raft consensus for this SN. With no members listed, this process is a singleton.
# To replicate the SN group, configure the same ring and member map on every member.
[raft]
# Number of recent shared entries retained by each member is 2^log2_entries.
log2_entries = 16
# Workers reading and writing checkpoint table chunks.
checkpoint_workers = 16
# ring = "SN0"
# [raft.member_indexes]
# SN0 = 0
# SN1 = 1
# SN2 = 2
# [raft.members]
# SN0 = "127.0.0.1:9500"
# SN1 = "127.0.0.1:9501"
# SN2 = "127.0.0.1:9502"

# Threads answering requests off the read loop. Zero means one per core.
[knobs]
# Opt in to primary reads after quorum lease expiry (may return stale data).
# Writes, committed-term readiness, and demotion checks are unchanged.
# SN/DN will enforce this when state-changing requests use Raft admission.
allow_stale_reads = false
workers = 0
