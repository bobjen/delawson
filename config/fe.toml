# FE, the Front End. One file like this per machine type.


# An FE keeps nothing across restarts, and saying so here makes a change to
# that a decision rather than a drift.
stateless = true

# §9.1.3.7's entry limit, which FE needs in order to divide a batch across the DNs
# that own its names before any of them sees it. The DN's own copy still caps the
# answer, so this being larger only makes the division optimistic.
info_entries = 10000

# Threads answering requests off the read loop. Zero means one per core.
[knobs]
workers = 0
