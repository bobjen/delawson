# KS: the Key Store. One file like this per machine type.


# Snapshot changed state daily, or when new journal bytes reach the larger of
# the previous snapshot size and this minimum. Bootstrap writes empty commit 0.
snapshot_min_log_bytes = 1048576
snapshot_interval_secs = 86400
# Keep these snapshots and every journal after the oldest retained snapshot.
snapshot_retain = 10

# A day that creates no extents needs no master key.
lazy_day_keys = true

# Delay before a newly generated master key takes effect, allowing ENs to cache
# the current derived key safely.
master_key_delay_secs = 3600

# Insecure development mode: use a known unlock key for the encrypted journal.
# start-laws overrides this with its generated operator unlock key.
# Nothing but a test configuration may say false here.
require_unlock = false

# Answer a ping on the connection's read loop instead of a worker thread. A ping
# is far too small to be worth a queue hop; turn it off to price one.
inline_ping = true

# Threads answering requests off the read loop. Zero means one per core.
[knobs]
workers = 0

# Without explicit raft.members, each KS process is an independent singleton.
# A replicated ring uses the same ring name and member map on every member,
# with distinct process IDs, listen addresses, and data directories.
# [raft]
# ring = "KS0"
# heartbeat_ms = 500
# election_min_ms = 3000
# election_max_ms = 6000
# request_timeout_ms = 1000
# [raft.members]
# KS0 = "127.0.0.1:9400"
# KS1 = "127.0.0.1:9401"
# KS2 = "127.0.0.1:9402"
