# DN, the Directory Node. One file like this per machine type.


# DN metadata lives in DeLawson keyed objects rather than a store of its own.
self_hosted = true

# The most entries one object-info answer may carry, over objects plus streams plus
# extents (§9.1.3.7). The design derives 10,000 from ~140 bytes an entry against an
# 8 MB segment cap; a test cluster sets it low so that paging is the common path
# rather than the rare one.
info_entries = 10000

# Threads answering requests off the read loop. Zero means one per core.
[knobs]
workers = 0
