[workspace]
resolver = "3"
members = ["common", "dn", "en", "fe", "ks", "laws", "logs", "pool", "raft", "random", "sn"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
delawson-pool = { path = "pool" }
delawson-random = { path = "random" }
delawson-raft = { path = "raft" }
delawson-common = { path = "common" }
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"

# Debug builds are for correctness, release builds for measurement (§1.6: every
# performance claim is measured against a hardware bound, so the numbers must
# come from an optimized build).
[profile.release]
debug = true
